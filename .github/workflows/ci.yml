name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install pytest ruff
      - run: ruff check .
      - run: pytest -q

  # Full compose stack with real Qdrant, TimescaleDB, Langfuse, real embeddings and the
  # real agent graph. The LLM is mocked (LLM_MOCK=1), so no secrets are needed.
  stack:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Configure env (mock LLM)
        run: |
          cp .env.example .env
          sed -i 's/^LLM_MOCK=.*/LLM_MOCK=1/; s/^GUARD_LLM=.*/GUARD_LLM=0/; s/^RATE_LIMIT_PER_MIN=.*/RATE_LIMIT_PER_MIN=1000/' .env
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 420
      - name: Ingest docs (real embeddings)
        run: docker compose exec -T api python -m scripts.ingest
      - name: Seed KPIs
        run: docker compose exec -T api python -m scripts.seed_kpis
      - name: Retrieval eval (real embeddings)
        run: |
          docker compose exec -T api python -m evals.run_eval > retrieval.txt
          { echo '### Retrieval eval (real embeddings, k=3)'; echo '```'; cat retrieval.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python scripts/check_eval.py --min-hit 0.9 --min-mrr 0.85 < retrieval.txt
      - name: Guardrail eval (rule-based cases)
        run: docker compose exec -T api python -m evals.run_guard_eval
      - name: MCP server tools
        run: docker compose exec -T api python -c "import asyncio; from app.mcp_server import mcp; print(sorted(t.name for t in asyncio.run(mcp.list_tools())))"
      - name: Wait for Langfuse
        run: |
          for i in $(seq 1 40); do curl -sf http://localhost:3000/api/public/health && break; sleep 5; done
      - name: End-to-end smoke
        env:
          LANGFUSE_URL: http://localhost:3000
        run: |
          set -o pipefail
          python scripts/e2e_smoke.py 2>&1 | tee smoke.txt
      - name: Publish results as annotations
        if: always()
        run: |
          docker compose logs --no-color --tail 150 api > api.log 2>&1 || true
          python3 - <<'PY'
          import pathlib
          def ann(level, title, path, limit=30000):
              p = pathlib.Path(path)
              if not p.exists():
                  return
              t = p.read_text(errors="replace")[-limit:]
              t = t.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::{level} title={title}::{t}")
          ann("notice", "retrieval eval (real embeddings)", "retrieval.txt")
          ann("notice", "e2e smoke", "smoke.txt")
          ann("warning", "api container log (tail)", "api.log")
          PY
      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v

  # Same stack against the real Anthropic API. Runs only when the ANTHROPIC_API_KEY
  # repository secret exists (Settings > Secrets and variables > Actions).
  live:
    runs-on: ubuntu-latest
    needs: stack
    if: github.event_name != 'pull_request'
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - id: key
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then echo "has_key=true" >> "$GITHUB_OUTPUT"; else echo "::notice::ANTHROPIC_API_KEY secret not set, skipping live LLM checks"; fi
      - uses: actions/checkout@v5
        if: steps.key.outputs.has_key == 'true'
      - name: Configure env (real Anthropic)
        if: steps.key.outputs.has_key == 'true'
        run: |
          grep -v -e '^ANTHROPIC_API_KEY=' -e '^RATE_LIMIT_PER_MIN=' .env.example > .env
          echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY" >> .env
          echo "RATE_LIMIT_PER_MIN=1000" >> .env
      - name: Start the stack
        if: steps.key.outputs.has_key == 'true'
        run: docker compose up -d --build --wait --wait-timeout 420
      - name: Ingest and seed
        if: steps.key.outputs.has_key == 'true'
        run: |
          docker compose exec -T api python -m scripts.ingest
          docker compose exec -T api python -m scripts.seed_kpis
      - name: Guardrail eval (with LLM classifier)
        if: steps.key.outputs.has_key == 'true'
        run: docker compose exec -T api python -m evals.run_guard_eval --min-accuracy 0.9
      - name: End-to-end smoke (real model)
        if: steps.key.outputs.has_key == 'true'
        run: python scripts/e2e_smoke.py
      - name: Generation eval (LLM judge, 30 answerable + unanswerable)
        if: steps.key.outputs.has_key == 'true'
        run: |
          docker compose exec -T api python -m evals.run_gen_eval --limit 30 --min-pass 0.7 --min-faithful 0.8 | tee gen.txt
          { echo '### Generation eval (live)'; echo '```'; cat gen.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Container logs (on failure)
        if: failure() && steps.key.outputs.has_key == 'true'
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always() && steps.key.outputs.has_key == 'true'
        run: docker compose down -v
