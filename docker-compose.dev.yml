# Local development overlay: publishes every service's port directly to the host, no TLS, no
# reverse proxy. Never use this file for anything reachable from outside your machine.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
services:
  qdrant:
    ports: ["6333:6333"]
  timescale:
    ports: ["5432:5432"]
  redis:
    ports: ["6379:6379"]
  langfuse:
    ports: ["3000:3000"]
  ollama:
    ports: ["11434:11434"]
  api:
    ports: ["8000:8000"]
  ui:
    ports: ["8080:8080"]
