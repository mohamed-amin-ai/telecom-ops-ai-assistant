services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]

  timescale:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: telecom
      POSTGRES_PASSWORD: telecom
      POSTGRES_DB: telecom
    ports: ["5432:5432"]
    volumes:
      - tsdb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telecom -d telecom"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse-db:
    image: postgres:16
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes: [lfdb_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-me
      SALT: change-me

  ollama:
    image: ollama/ollama:latest
    # docker compose --profile local up
    profiles: ["local"]
    ports: ["11434:11434"]
    volumes: [ollama_data:/root/.ollama]

  # One-shot: applies db/migrations/*.sql (tracked in schema_migrations) and sets up
  # LangGraph's own checkpoint tables. Re-run any time with:
  #   docker compose run --rm migrate
  migrate:
    build: .
    env_file: .env
    depends_on:
      timescale:
        condition: service_healthy
    command: python -m scripts.migrate
    restart: "no"

  api:
    build: .
    env_file: .env
    environment:
      FASTEMBED_CACHE_PATH: /cache
    depends_on:
      qdrant:
        condition: service_started
      timescale:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports: ["8000:8000"]
    volumes:
      - fastembed_cache:/cache
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

  ui:
    build: .
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
      API_KEY: ${API_KEY:-}
    ports: ["8080:8080"]
    command: chainlit run ui/app.py --host 0.0.0.0 --port 8080 --headless
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

volumes:
  qdrant_data:
  tsdb_data:
  redis_data:
  lfdb_data:
  ollama_data:
  fastembed_cache:
