# Base file: internal services only, no host ports published, no Caddy/TLS. On its own this
# is not reachable from outside the Docker network -- that's deliberate; see:
#   docker-compose.dev.yml   local development: publishes ports directly, plain HTTP
#   docker-compose.prod.yml  production: adds Caddy (TLS), multiple workers, Prometheus/Grafana
# Run one of:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#              docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes: [qdrant_data:/qdrant/storage]

  timescale:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: telecom
      POSTGRES_PASSWORD: telecom
      POSTGRES_DB: telecom
    volumes:
      - tsdb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telecom -d telecom"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes: [lfdb_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse:
    image: langfuse/langfuse:2
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: ${LANGFUSE_PUBLIC_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set LANGFUSE_NEXTAUTH_SECRET in .env}
      SALT: ${LANGFUSE_SALT:?set LANGFUSE_SALT in .env}

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # docker compose --profile local up
    profiles: ["local"]
    volumes: [ollama_data:/root/.ollama]

  # One-shot: applies db/migrations/*.sql (tracked in schema_migrations), bootstraps any
  # BOOTSTRAP_API_KEYS, and sets up LangGraph's own checkpoint tables. Re-run any time with:
  #   docker compose run --rm migrate
  migrate:
    build: .
    env_file: .env
    depends_on:
      timescale:
        condition: service_healthy
    command: python -m scripts.migrate
    restart: "no"

  api:
    build:
      context: .
      args:
        INSTALL_EVAL: ${INSTALL_EVAL:-0}
    env_file: .env
    environment:
      FASTEMBED_CACHE_PATH: /cache
      PROMETHEUS_MULTIPROC_DIR: /tmp/prom
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_started
      timescale:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - fastembed_cache:/cache
    command: >
      sh -c 'uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-1}'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

  ui:
    build: .
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
      CHAINLIT_AUTH_SECRET: ${CHAINLIT_AUTH_SECRET:?set CHAINLIT_AUTH_SECRET in .env (openssl rand -hex 32)}
    command: chainlit run ui/app.py --host 0.0.0.0 --port 8080 --headless
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

volumes:
  qdrant_data:
  tsdb_data:
  redis_data:
  lfdb_data:
  ollama_data:
  fastembed_cache:
